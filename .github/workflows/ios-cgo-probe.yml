name: iOS runtime compatibility matrix

on:
  push:
    branches:
      - ios
    paths:
      - '.github/workflows/ios-cgo-probe.yml'
      - 'PORTING_IOS.md'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/ios/**'
      - 'tools/ios-cgo-probe/**'
      - 'tools/ios-runtime-probes/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-cgo-probe:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GOOS: ios
      GOARCH: arm64
      CGO_ENABLED: '1'
      IOS_DEPLOYMENT_TARGET: '12.0'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Go 1.26.7 toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: false

      - name: Record Apple toolchain and initialize matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios
          : > build/ios/build-status.txt
          : > build/ios/toolchain-info.txt
          {
            printf 'Git commit='; git rev-parse HEAD
            printf 'RUNNER_ARCH='; uname -m
            printf 'macOS version='; sw_vers -productVersion
            printf 'XCODE_SELECT='; xcode-select -p
            xcodebuild -version
            printf 'IPHONEOS_SDK_PATH='; xcrun --sdk iphoneos --show-sdk-path
            printf 'IPHONEOS_SDK_VERSION='; xcrun --sdk iphoneos --show-sdk-version
            printf 'CLANG_PATH='; xcrun --sdk iphoneos --find clang
            clang_path="$(xcrun --sdk iphoneos --find clang)"
            "$clang_path" --version | head -1
            printf 'GO126_VERSION='; go version
            printf 'GO126_GOOS='; go env GOOS
            printf 'GO126_GOARCH='; go env GOARCH
            printf 'GO126_CGO_ENABLED='; go env CGO_ENABLED
            printf 'GO126_GOVERSION='; go env GOVERSION
            printf 'GOOS=%s\n' "$GOOS"
            printf 'GOARCH=%s\n' "$GOARCH"
            printf 'CGO_ENABLED=%s\n' "$CGO_ENABLED"
            printf 'DEPLOYMENT_TARGET=%s\n' "$IOS_DEPLOYMENT_TARGET"
          } | tee -a build/ios/toolchain-info.txt

      - name: Build native C control probe
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/ios/build-native-c-probe.sh scripts/ios/build-runtime-probe.sh scripts/ios/inspect-runtime-probes.sh
          scripts/ios/build-native-c-probe.sh build/ios/native-c-probe 2>&1 | tee build/ios/native-c-build.log
          printf 'native-c=PASS\n' >> build/ios/build-status.txt

      - name: Install Go 1.20.14 toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false

      - name: Build Go 1.20.14 probes
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'GO120_VERSION='; go version
            printf 'GO120_GOOS='; go env GOOS
            printf 'GO120_GOARCH='; go env GOARCH
            printf 'GO120_CGO_ENABLED='; go env CGO_ENABLED
            printf 'GO120_GOVERSION='; go env GOVERSION
          } | tee -a build/ios/toolchain-info.txt

          run_probe() {
            local label="$1"
            shift
            {
              printf 'COMMAND='
              printf '%q ' "$@"
              printf '\n'
              "$@"
            } >"build/ios/${label}-build.log" 2>&1
          }

          if run_probe go120 "scripts/ios/build-runtime-probe.sh" build/ios/go120-probe tools/ios-runtime-probes/go/main.go; then
            printf 'go120-pure=PASS\n' >> build/ios/build-status.txt
          else
            status=$?
            printf 'go120-pure=FAIL exit=%s\n' "$status" >> build/ios/build-status.txt
            printf 'Go 1.20.14 pure probe build failed with exit %s; continuing for diagnostic artifact\n' "$status"
          fi

          if run_probe go120-cgo "scripts/ios/build-runtime-probe.sh" build/ios/go120-cgo-probe tools/ios-cgo-probe/main.go; then
            printf 'go120-cgo=PASS\n' >> build/ios/build-status.txt
          else
            status=$?
            printf 'go120-cgo=FAIL exit=%s\n' "$status" >> build/ios/build-status.txt
            printf 'Go 1.20.14 CGO probe build failed with exit %s; continuing for diagnostic artifact\n' "$status"
          fi

      - name: Restore Go 1.26.7 toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: false

      - name: Build Go 1.26.7 probes and preserve Prompt 002 path
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'GO126_RESTORED_VERSION='; go version
            printf 'GO126_RESTORED_GOOS='; go env GOOS
            printf 'GO126_RESTORED_GOARCH='; go env GOARCH
            printf 'GO126_RESTORED_CGO_ENABLED='; go env CGO_ENABLED
            printf 'GO126_RESTORED_GOVERSION='; go env GOVERSION
          } | tee -a build/ios/toolchain-info.txt

          scripts/ios/build-runtime-probe.sh build/ios/go126-probe tools/ios-runtime-probes/go/main.go 2>&1 | tee build/ios/go126-build.log
          printf 'go126-pure=PASS\n' >> build/ios/build-status.txt

          # Keep the Prompt 002 build command and output alive as a regression
          # check, then give the same signed executable its matrix name.
          scripts/ios/build-cgo-probe.sh build/ios/ios-cgo-probe 2>&1 | tee build/ios/go126-cgo-build.log
          cp build/ios/ios-cgo-probe build/ios/go126-cgo-probe
          printf 'go126-cgo=PASS\n' >> build/ios/build-status.txt

      - name: Inspect and ad-hoc sign every matrix executable
        shell: bash
        run: |
          set -euo pipefail
          scripts/ios/inspect-runtime-probes.sh \
            build/ios \
            build/ios/probe-inspection.txt \
            native-c-probe \
            go120-probe \
            go120-cgo-probe \
            go126-probe \
            go126-cgo-probe

      - name: Write reproducibility metadata and checksums
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'Git commit='; git rev-parse HEAD
            cat build/ios/toolchain-info.txt
            printf '%s\n' '--- build status ---'
            cat build/ios/build-status.txt
            for log in build/ios/*-build.log; do
              [[ -f "$log" ]] || continue
              printf '%s\n' "--- $log ---"
              cat "$log"
            done
            printf '%s\n' '--- Mach-O and signing inspection ---'
            cat build/ios/probe-inspection.txt
          } > build/ios/build-info.txt

          : > build/ios/SHA256SUMS
          for probe in native-c-probe go120-probe go120-cgo-probe go126-probe go126-cgo-probe; do
            if [[ -f "build/ios/$probe" ]]; then
              (cd build/ios && shasum -a 256 "$probe") >> build/ios/SHA256SUMS
            fi
          done
          cat build/ios/SHA256SUMS

      - name: Stage and upload runtime matrix artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-runtime-compatibility-matrix
          if-no-files-found: error
          path: |
            build/ios/native-c-probe
            build/ios/go120-probe
            build/ios/go120-cgo-probe
            build/ios/go126-probe
            build/ios/go126-cgo-probe
            build/ios/SHA256SUMS
            build/ios/build-info.txt
