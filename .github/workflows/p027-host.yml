name: P027 host security regressions
on:
  pull_request:
    branches: [iOS, ios/p027-security-port]
    paths: ['**/*.go', 'go.mod', 'go.sum', '.github/workflows/p027-host.yml', 'scripts/security/**', 'package.json', 'package-lock.json', 'web_src/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-driver:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: forgejo_p030
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: UTC
      GOMAXPROCS: '2'
      TEST_PGSQL_HOST: 127.0.0.1:5432
      TEST_PGSQL_DBNAME: forgejo_p030
      TEST_PGSQL_USERNAME: postgres
      TEST_PGSQL_PASSWORD: ''
      TEST_PGSQL_SCHEMA: ''
      TEST_TYPE: integration
      TEST_STORAGE_TYPE: local
      REPO_TEST_DIR: ${{ runner.temp }}/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Run isolated PostgreSQL driver lifecycle and security regressions
        env:
          P030_POSTGRES_DSN: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: go test -p 2 ./tests/pgxcompat
      - name: Build Forgejo integration executable
        run: make backend TAGS='sqlite sqlite_unlock_notify'
      - name: Run application authentication, repository and release queries on PostgreSQL
        run: make test-pgsql GOTESTCOMPILEDRUNSUFFIX="-test.run='Test(P030OrganisationVisibility|APIReleaseList|APIOrgRepos|APIUserReposNotLogin|CombinedStatusReturnsPendingWhenCommitHasNoStatuses|CombinedStatusKeepsEmptyObjectWhenPageExceedsResults|PackageNpm|PackageDebian)'"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: UTC
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go modules and vet the full application
        run: |
          set -euo pipefail
          go version
          go mod tidy -diff
          go mod verify
          go vet -p 2 ./...
      - name: Unit and SQLite fixture checks
        run: go test -p 2 -tags='sqlite sqlite_unlock_notify' ./models/auth ./models/issues ./modules/updatechecker ./routers/api/packages/nuget ./services/auth ./services/authz ./services/user ./models/perm/access ./services/issue ./services/actions ./services/repository
      - name: Build backend required by integration subprocesses
        run: make backend TAGS='sqlite sqlite_unlock_notify'
      - name: API and workflow trust integration checks
        run: make test-sqlite GOTESTCOMPILEDRUNSUFFIX="-test.run='Test(P030OrganisationVisibility|APIRelease|P029ForcePushCompatibilityBaseline|ForgeryCreateTeamUnitPersistence|PullViewConversation|ActionsForcePushCommitStatus|APIModifyLabels|PackageNuGet|PackageNpm|PackageDebian|CombinedStatusReturnsPendingWhenCommitHasNoStatuses|CombinedStatusKeepsEmptyObjectWhenPageExceedsResults|ActionsForkPullRequest|APIStar|APIWatch|PullAutoMergeFromFork|GitPushConcurrentBranchUpdate|ActionsAPIWorkflowDispatch|APIOrgEdit|ActionsFinishLogs|ActionsDownloadTask)'"

  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 3GiB
      GOFLAGS: -p=2
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scanner failure and coverage regression fixtures
        run: python3 -m unittest discover -s scripts/security -p 'test_*.py'
      - name: Full module, package and symbol scans with coverage and resource evidence
        run: python3 scripts/security/p028-govulncheck.py --output build/security/p028
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p028-vulnerability-evidence
          path: build/security/p028
          if-no-files-found: error
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run
      - run: make frontend
      - name: Record dependency advisories without changing the failure threshold
        run: npm audit --audit-level=low --json > npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p028-frontend-audit
          path: npm-audit.json
