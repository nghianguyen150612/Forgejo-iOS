name: P027 host security regressions
on:
  pull_request:
    branches: [iOS]
    paths: ['**/*.go', 'go.mod', 'go.sum', '.github/workflows/p027-host.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: UTC
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Unit and SQLite fixture checks
        run: go test -p 2 -tags='sqlite sqlite_unlock_notify' ./models/issues ./routers/api/packages/nuget ./services/auth ./services/authz
      - name: API and workflow trust integration checks
        run: make 'test-sqlite#Test(APIModifyLabels|PackageNuGet|ActionsForkPullRequest)'
